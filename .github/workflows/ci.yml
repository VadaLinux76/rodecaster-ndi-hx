name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (syntax check)
        run: |
          for f in *.sh; do bash -n "$f"; done
      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: '.'
          severity: warning

  # Test del modulo annexb.h/.cpp (parsing Annex-B + ricostruzione access unit), estratto
  # apposta da ndi_hx_send.cpp per non dipendere dall'SDK NDI proprietario, che qui in CI non
  # e' scaricabile automaticamente (code review: Codex, fase 2 - "questa parte puo' essere
  # compilata e testata senza SDK proprietario").
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Installa il compilatore
        run: |
          if [ "${{ matrix.compiler }}" = "clang++" ]; then
            sudo apt-get update && sudo apt-get install -y clang
          fi
      - name: Build con warning severi (-Werror)
        run: |
          ${{ matrix.compiler }} -std=c++17 -O2 -Wall -Wextra -Wpedantic -Wconversion \
            -Wsign-conversion -Werror \
            -o test_annexb tests/test_annexb.cpp annexb.cpp
      - name: Esegui i test
        run: ./test_annexb
      - name: Build con AddressSanitizer + UndefinedBehaviorSanitizer
        run: |
          ${{ matrix.compiler }} -std=c++17 -O1 -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined \
            -o test_annexb_sanitized tests/test_annexb.cpp annexb.cpp
      - name: Esegui i test sotto sanitizer
        run: ./test_annexb_sanitized

  # Verifica il sistema di build CMake (code review: Codex, fase 3 - "unificare le build con
  # CMake o Meson, aggiungere target build/test"). L'SDK NDI non e' scaricabile in CI, quindi
  # qui si costruisce solo cio' che non ne dipende (modulo annexb + test via CTest) -- gli
  # script bash restano il modo supportato per compilare ndi_hx_send/ndi_hx_inspect in CI.
  cmake-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configura
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --verbose
      - name: Test (CTest)
        run: ctest --test-dir build --output-on-failure
